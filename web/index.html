<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>ollama-agent</title>
    <style>
      :root {
        --bg: #0f1115;
        --surface: #171a21;
        --surface-2: #1e222b;
        --border: #2a2f3a;
        --text: #e6e8ee;
        --muted: #8b90a0;
        --accent: #7aa2f7;
        --green: #9ece6a;
        --red: #f7768e;
        --yellow: #e0af68;
        --radius: 10px;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        height: 100dvh;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-wrap: wrap;
      }
      .brand { font-weight: 700; letter-spacing: 0.2px; }
      .brand span { color: var(--accent); }
      .grow { flex: 1; }
      select, textarea, button {
        font: inherit;
        color: var(--text);
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
      }
      select:focus, textarea:focus, button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .muted { color: var(--muted); font-size: 13px; }
      main {
        flex: 1;
        overflow-y: auto;
        padding: 18px 16px 8px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .msg { max-width: 900px; width: 100%; margin: 0 auto; }
      .msg.user .bubble {
        margin-left: auto;
        width: fit-content;
        max-width: 80%;
        background: #223049;
        border-color: #2f4467;
      }
      .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 13px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .tool {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        overflow: hidden;
      }
      .tool summary {
        cursor: pointer;
        padding: 8px 12px;
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .tool summary::marker { color: var(--muted); }
      .tool .name { color: var(--green); font-weight: 600; }
      .tool .arg { color: var(--muted); font-family: ui-monospace, monospace; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tool pre {
        margin: 0;
        padding: 10px 12px;
        border-top: 1px solid var(--border);
        font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: #c4c9d6;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 320px;
        overflow: auto;
      }
      .tool.error .name, .error { color: var(--red); }
      details.thinking { max-width: 900px; width: 100%; margin: 0 auto; color: var(--muted); font-size: 13px; }
      details.thinking pre { white-space: pre-wrap; font: inherit; margin: 6px 0 0; }
      .notice { max-width: 900px; width: 100%; margin: 0 auto; color: var(--muted); font-size: 13px; }
      .approval {
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        border: 1px solid #5a4a25;
        background: #221d12;
        border-radius: var(--radius);
        padding: 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .approval .text { flex: 1; min-width: 200px; }
      .approval button { cursor: pointer; }
      .approval button.allow { border-color: #3d5a2a; color: var(--green); }
      .approval button.deny { border-color: #5a2a33; color: var(--red); }
      .approval button.always { border-color: var(--border); color: var(--yellow); }
      .approval .done { color: var(--muted); font-size: 13px; }
      form {
        display: flex;
        gap: 10px;
        padding: 12px 16px 16px;
        border-top: 1px solid var(--border);
        background: var(--surface);
        align-items: flex-end;
      }
      textarea {
        flex: 1;
        resize: none;
        min-height: 46px;
        max-height: 220px;
        line-height: 1.45;
      }
      button.send {
        cursor: pointer;
        background: var(--accent);
        border-color: var(--accent);
        color: #0b1020;
        font-weight: 600;
        padding: 10px 16px;
      }
      button.send:disabled { opacity: 0.5; cursor: default; }
      @media (max-width: 600px) {
        header { padding: 8px 10px; }
        main { padding: 12px 10px 4px; }
        form { padding: 10px; }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">ollama<span>-agent</span></div>
      <select id="model" title="Model"></select>
      <select id="mode" title="Permission mode">
        <option value="default">default</option>
        <option value="acceptEdits">acceptEdits</option>
        <option value="plan">plan</option>
        <option value="bypassPermissions">bypassPermissions</option>
      </select>
      <div class="grow"></div>
      <div class="muted" id="mcp"></div>
    </header>

    <main id="log"></main>

    <form id="composer">
      <textarea id="input" rows="1" placeholder="Ask the agent…  (Enter to send, Shift+Enter for newline)"></textarea>
      <button class="send" id="send" type="submit">Send</button>
    </form>

    <script src="./browser-bridge.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
