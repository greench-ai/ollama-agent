name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install PDF tooling
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Eval
        run: npm run eval
      - name: Bundle Electron and web
        run: |
          npm run electron:build
          npm run build:acp
          npm run build:web
